<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Continental Grand Technologies | Digital Engineering Studio</title>
    <meta name="description" content="CGT is a digital engineering studio building high-performance software systems, AI automation, and enterprise platforms for businesses that demand precision." />
    <meta name="theme-color" content="#000000" />
    <meta property="og:title" content="Continental Grand Technologies | Digital Engineering Studio" />
    <meta property="og:description" content="Full-stack development, AI automation, and enterprise systems — engineered for businesses that demand precision and performance." />
    <meta property="og:type" content="website" />
    <style>
      body, html {
        margin: 0;
        padding: 0;
        background-color: #000000;
        width: 100%;
        height: 100%;
      }
      .initial-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        background-color: #000000;
      }
      .initial-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.05);
        border-top-color: #F4751E;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="initial-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
